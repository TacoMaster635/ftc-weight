<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTC Robot Weight & Part Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>FTC Robot Builder</h1>
            <p>Browse the part library, build your robot, and track total weight.</p>
        </header>

        <!-- Dashboard Summary -->
    <div class="dashboard">
        <div class="card total-card">
            <h2>Total Robot Weight</h2>
            <div id="total-weight">0.0</div>
            <span class="unit">grams (g)</span>
            <div class="weight-lbs" id="total-weight-lbs" style="margin-top: 8px; font-size: 1.2rem; color: var(--success-color);">0.00 lbs</div>
        </div>
    </div>

        <div class="main-layout">
            <!-- Left Column: Part Library Browser -->
            <section class="library-section">
                <h2>Part Library</h2>
                <div class="library-controls">
                    <input type="text" id="search-input" placeholder="Search parts by name or type...">
                </div>
                <div class="table-responsive">
                    <table id="library-table">
                        <thead>
                            <tr>
                                <th>Part Name</th>
                                <th>Type</th>
                                <th>Manufacturer</th>
                                <th>Weight</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="library-tbody">
                            <!-- Loaded dynamically via JSON -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Right Column: My Robot Manifest -->
            <section class="manifest-section">
                <h2>My Robot Parts</h2>
                <div class="table-responsive">
                    <table id="manifest-table">
                        <thead>
                            <tr>
                                <th>Part Name</th>
                                <th>Weight</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="manifest-tbody">
                            <!-- Selected parts go here -->
                        </tbody>
                    </table>
                </div>
                <button id="clear-manifest" class="btn-danger">Clear Robot Build</button>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>

<footer class="footer">
Made by TacoMaster635 "Taco" from #14204 Super Scream Bros.
</footer>
</html>
